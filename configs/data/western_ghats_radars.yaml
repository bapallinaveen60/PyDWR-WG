    frequency_ghz: 2.8
    beamwidth_deg: 1.0
    pulse_width_us: 1.0
    unambiguous_range_km: 250.0
    max_processing_range_km: 100.0
    clutter_blind_zone_km: 5.0

  kochi:
    name: "Kochi S-band DWR"
