hacpl_validation:
  name: "High Altitude Cloud Physics Laboratory (HACPL) Mahabaleshwar"
  latitude: 17.9200
  longitude: 73.6000
  altitude_m: 1378.0
  instruments:
    - "JWD (Joss-Waldvogel Disdrometer)"
    - "2DVD (Two-Dimensional Video Disdrometer)"
    - "MRR-2 (Micro Rain Radar 24 GHz, 0-6 km AGL, 200m bins)"

ray_tracing:
  earth_model: "effective_4_thirds_earth"
  effective_radius_factor: 1.3333333
  standard_refractivity_gradient: -39.0 # N-units/km
  angular_resolution_deg: 0.1
  radial_step_m: 100.0
  beam_power_weighting: "gaussian" # 2D Gaussian beam shape
